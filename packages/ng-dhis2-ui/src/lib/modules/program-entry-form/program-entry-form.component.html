@if (loading()) {
<div className="program-entry__form-loader">
  <ng-dhis2-ui-wrapper [component]="FormLoader" />
</div>
} @else if(metaData()) {

<div>
  <!-- Form content -->
  @switch (config().displayType) {

  <!-- Flat display -->
  @case ('FLAT') {
  <ng-dhis2-ui-flat-form
    [programEntryFormConfig]="config()"
    [optionCascadeConfigs]="config().optionCascadeConfigs || []"
    [collapsibleSections]="collapsibleSections()"
    [programEntryFormMetaData]="metaData()!"
    [name]="metaData()!.name"
    [dataValues]="dataEntities()"
    [dataId]="dataId()"
    [rules]="metaData()!.rules"
    [fields]="metaData()!.formFields"
    [customOrgUnitRoots]="customOrgUnitRoots()"
    [coordinatePickerGeoConfig]="config().coordinatePickerGeoConfig"
    (formUpdate)="onFormUpdate($event)"
    (formValidityUpdate)="onValidityUpdate($event)"
  />

  <!-- <ng-dhis2-ui-flat-form
    [name]="metaData()!.name"
    [dataValues]="instance() || {}"
    [dataId]="dataId()"
    [rules]="metaData()!.rules"
    [fields]="metaData()!.formFields"
    [customOrgUnitRoots]="customOrgUnitRoots()"
    [program]="config().program"
    (formUpdate)="onFormUpdate($event)"
    (formValidityUpdate)="onValidityUpdate($event)"
  /> -->
  }

  <!-- SECTION display -->
  @case ('SECTION') { Section form }

  <!-- CUSTOM FORM -->
  @case ('CUSTOM') { } }

  <!-- Action buttons -->

  @if(!config().hideActionButtons) {
  <ng-dhis2-ui-wrapper [component]="FormActionButtons()" />
  }
</div>
}

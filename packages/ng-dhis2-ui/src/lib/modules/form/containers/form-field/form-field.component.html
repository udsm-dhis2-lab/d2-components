@if (field(); as formField) {
  @let fieldError = runtimeError();
  @let isAssigned = isValueAssigned();
  @let fieldConfigValue = fieldConfig();
  @let cascadeConfigs = optionCascadeConfigs();
  @let entryFormCoordinatePickerGeoConfig = coordinatePickerGeoConfig();

  <div class="form-field-item">
    <ng-dhis2-ui-form-field-item
      [field]="getDisplayField(formField)"
      [fieldError]="fieldError"
      [isValueAssigned]="isAssigned"
      [fieldConfig]="fieldConfigValue"
      [(form)]="form"
      [programRuleOptions]="programRuleOptions()"
      [runtimeOptions]="runtimeOptions"
      [dataId]="dataId()"
      [customOrgUnitRoots]="customOrgUnitRoots()"
      [optionCascadeConfigs]="cascadeConfigs"
      [optionCascadeConfigMap]="optionCascadeConfigMap()"
      [fieldControlKeyById]="fieldControlKeyById()"
      [coordinatePickerGeoConfig]="entryFormCoordinatePickerGeoConfig"
      [program]="program()"
      [value]="value()"
      (update)="onValueChange()"
      (immediateUpdate)="onImmediateChange($event)"
      (runtimeOptionsChange)="onRuntimeOptionsChange($event)"
    />
  </div>
}

<div class="d2-dashboard__sub-menu-container" role="list">
  <button
    type="button"
    role="listitem"
    *ngFor="let dashboardSubMenu of dashboardSubMenus; trackBy: trackById"
    class="d2-dashboard__sub-menu-item"
    [class.d2-dashboard__sub-menu-item-selected]="dashboardSubMenu.id === curentDashboardSubMenu?.id"
    [matTooltip]="dashboardSubMenu.name"
    [attr.aria-current]="dashboardSubMenu.id === curentDashboardSubMenu?.id ? 'page' : null"
    (click)="onSetCurrentDashboardSubMenu($event, dashboardSubMenu)"
  >
    {{ dashboardSubMenu.name }}
  </button>
</div>

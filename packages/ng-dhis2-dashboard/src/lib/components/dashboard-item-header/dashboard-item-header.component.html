<div
  class="d2-dashboard__visualization-header {{
    fullScreen ? 'd2-dashboard__fullscreen-header' : ''
  }}"
  >
  <div class="d2-dashboard__visualization-title-block">
    <ng-dhis2-ui-wrapper
      [component]="VisualizationOptionButton"
    ></ng-dhis2-ui-wrapper>
    <div class="d2-dashboard__visualization-title">
      {{ visualizationTitle }}
    </div>
  </div>

  <div class="d2-dashboard__visualization-actions">
    <!-- Download section -->
    <div class="d2-dashboard__visualization-download-block">
      @if (DownloadButton) {
        <ng-dhis2-ui-wrapper
          class="d-print-none"
          [component]="DownloadButton"
        ></ng-dhis2-ui-wrapper>
      }
    </div>

    <!-- Fullscreen section -->
    <ng-dhis2-ui-wrapper
      class="d-print-none"
      [component]="FullScreenButton"
    ></ng-dhis2-ui-wrapper>
  </div>
</div>

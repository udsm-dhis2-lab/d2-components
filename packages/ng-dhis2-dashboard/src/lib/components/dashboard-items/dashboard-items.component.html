<div
  class="d2-dashboard__current-dashboard-items-container"
  id="d2_dashboard_items"
>
  <div class="d2-dashboard__viewport-status" role="status" aria-live="polite">
    Dashboard visualizations load as they enter the viewport.
  </div>
  <ktd-grid
    [cols]="cols"
    [rowHeight]="rowHeight"
    [layout]="dashboardItemsLayout"
    class="d2-dashboard__grid-container"
  >
    @for (dashboardItem of dashboardItems; track trackById($index,
    dashboardItem)) {
    <ktd-grid-item
      [draggable]="false"
      [resizable]="false"
      [id]="dashboardItem.id"
      ngDhis2UiViewportActivation
      [viewportActivationKey]="activationKey(dashboardItem.id)"
      (viewportActivate)="activateItem(dashboardItem.id)"
      class="d2-dashboard__dashboard-item dashboard-item-{{ dashboardItem.id }}"
    >
      <div class="d2-dashboard__dashboard-item-card">
        @if (isItemActivated(dashboardItem.id)) {
        <d2-dashboard-item
          [dashboardItem]="dashboardItem"
          [dataSelections]="dataSelections"
        ></d2-dashboard-item>
        } @else {
        <div
          class="d2-dashboard__dashboard-item-placeholder"
          aria-hidden="true"
        >
          Visualization will load when visible
        </div>
        }
      </div>
    </ktd-grid-item>
    }
  </ktd-grid>
</div>
